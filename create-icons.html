<!DOCTYPE html>
<html>
<head>
    <title>Create FRC App Icons</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        canvas { border: 2px solid #333; margin: 10px; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>FRC App Icon Generator</h1>
    <p>Right-click each canvas and "Save Image As..." to create your icons</p>
    <div>
        <h3>icon-192.png (192x192)</h3>
        <canvas id="canvas192" width="192" height="192"></canvas>
    </div>
    <div>
        <h3>icon-512.png (512x512)</h3>
        <canvas id="canvas512" width="512" height="512"></canvas>
    </div>
    
    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, size);
            gradient.addColorStop(0, '#0066cc');
            gradient.addColorStop(1, '#0044aa');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // FRC Text
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${size * 0.3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('FRC', size / 2, size / 2);
            
            // Video icon
            ctx.font = `${size * 0.15}px Arial`;
            ctx.fillText('🎥', size / 2, size * 0.75);
        }
        
        createIcon('canvas192', 192);
        createIcon('canvas512', 512);
    </script>
</body>
</html>
